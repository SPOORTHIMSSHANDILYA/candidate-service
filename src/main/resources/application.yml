server:
  port: 8081

spring:
  application:
    name: candidate-service
  datasource:
    url: jdbc:mysql://localhost:3306/candidate_management
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: false        # TEMPORARY: tables created manually in Workbench; enable before submission